<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Opening in Lattice Notes…</title>
    <style>
        :root {
            --bg: #ffffff;
            --border: #d0d7de;
            --fg: #1f2328;
            --fg-muted: #59636e;
            --accent: #0969da;
            --error: #d1242f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.5;
        }
        .content {
            max-width: 640px;
            width: 100%;
            text-align: center;
        }
        .logo-link {
            display: inline-block;
            margin: 0 auto 24px;
        }
        .logo {
            display: block;
        }
        .wordmark {
            font-size: 24px;
            font-weight: 700;
            color: var(--fg);
            margin-bottom: 24px;
            letter-spacing: -0.25px;
        }
        p {
            color: var(--fg);
            font-size: 15px;
            margin-bottom: 16px;
        }
        p.lead {
            font-size: 18px;
            margin-bottom: 32px;
        }
        p:last-child { margin-bottom: 0; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .error { color: var(--error); }
    </style>
</head>
<body>
    <div class="content">
        <a href="https://aka.ms/lattice-notes" class="logo-link"><img src="app-logo.png" width="128" height="128" alt="Lattice Notes" class="logo"></a>
        <h1 class="wordmark">Lattice Notes</h1>
        <div id="body"></div>
    </div>

    <script>
        (function () {
            function getValidatedGithubRepoBase(repoValue) {
                try {
                    if (!repoValue) {
                        return null;
                    }
                    var parsed = new URL(repoValue);
                    if (parsed.protocol !== "https:" || parsed.hostname !== "github.com") {
                        return null;
                    }
                    var match = parsed.pathname.match(/^\/[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+\/?$/);
                    if (!match) {
                        return null;
                    }
                    return "https://github.com" + parsed.pathname.replace(/\/+$/, "");
                } catch (e) {
                    return null;
                }
            }

            var params = new URLSearchParams(window.location.search);
            var repo = getValidatedGithubRepoBase(params.get("repo"));
            var branch = params.get("branch");
            var path = params.get("path") || "";
            var title = params.get("title");
            var type = params.get("type");

            // type=n (root) is the only case where path may be empty. It names
            // the root of whichever tree the branch selects — a notebook, or a
            // whole repository.
            var isRoot = type === "n";
            var isFolder = type === "f";
            var isSection = type === "s";

            // The branch is what decides which of the app's two trees this link
            // opens in, and therefore which nouns this page should use. A
            // "_notebook/" branch is a notebook of pages; everything else — the
            // repository's default branch, or a "draft/{login}" — is the
            // repository itself, whose leaves are files.
            var isNotebook = branch !== null && branch.indexOf("_notebook/") === 0;

            var body = document.getElementById("body");

            if (!repo || !branch || (!isRoot && !path)) {
                var errP = document.createElement("p");
                errP.className = "error";
                errP.textContent = "This link is missing required parameters.";
                body.appendChild(errP);
                return;
            }

            var typeLabel = isSection ? "section"
                : isFolder ? "folder"
                : isRoot ? (isNotebook ? "notebook" : "repository")
                : (isNotebook ? "page" : "file");

            if (title) {
                document.title = "Opening " + title + " in Lattice Notes\u2026";
            }

            // Paragraph 1: what this page is doing
            var p1 = document.createElement("p");
            p1.className = "lead";
            p1.appendChild(document.createTextNode("Opening "));
            if (title) {
                var strong = document.createElement("strong");
                strong.textContent = title;
                p1.appendChild(strong);
                p1.appendChild(document.createTextNode(" " + typeLabel));
            } else {
                p1.appendChild(document.createTextNode(typeLabel));
            }
            p1.appendChild(document.createTextNode(" in Lattice Notes\u2026"));
            body.appendChild(p1);

            // Paragraph 2: install link
            var p2 = document.createElement("p");
            p2.appendChild(document.createTextNode("Not opening? Install "));
            var installLink = document.createElement("a");
            installLink.href = "https://aka.ms/lattice-notes";
            installLink.textContent = "Lattice Notes";
            p2.appendChild(installLink);
            body.appendChild(p2);

            // Paragraph 3: GitHub view link.
            //
            // Every repository link has one, because every node in a repository
            // is a real path in the tree: a root and a folder point at /tree/,
            // a file and a section at /blob/ (the section's slug rides along on
            // `path` and works as a GitHub anchor unchanged).
            //
            // A notebook is different. Its root and its folders are entries in
            // structure.yml rather than directories, so there is nothing on
            // GitHub to point at and the link is omitted for those two.
            var isTree = isRoot || isFolder;
            if (!isNotebook || !isTree) {
                var githubUrl = repo + (isTree ? "/tree/" : "/blob/") + branch
                    + (path ? "/" + path : "");
                var p3 = document.createElement("p");
                p3.appendChild(document.createTextNode("Or view read-only "));
                var ghLink = document.createElement("a");
                ghLink.href = githubUrl;
                ghLink.textContent = typeLabel + " on GitHub";
                p3.appendChild(ghLink);
                p3.appendChild(document.createTextNode("."));
                body.appendChild(p3);
            }

            // Build the notation: URI. Forward type so the app can route
            // folder/notebook links correctly; title is display-only.
            var notationUri = "notation:open"
                + "?repo=" + encodeURIComponent(repo)
                + "&branch=" + encodeURIComponent(branch)
                + "&path=" + encodeURIComponent(path);
            if (type) {
                notationUri += "&type=" + encodeURIComponent(type);
            }

            // Attempt to open. Defer until the page has fully loaded so the
            // browser can finish fetching the favicon first — Chromium-based
            // browsers cancel in-flight low-priority resource loads (including
            // favicon.ico) as soon as a navigation to a custom scheme is
            // initiated, which leaves the tab with no icon.
            function dispatch() { window.location = notationUri; }
            if (document.readyState === "complete") {
                setTimeout(dispatch, 0);
            } else {
                window.addEventListener("load", function () { setTimeout(dispatch, 0); });
            }
        })();
    </script>
</body>
</html>
